<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - My Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar px-3" style="background-color: rgb(131, 30, 30);">
    <a class="navbar-brand" href="index.html">My Shop</a>
    <div>
      <a href="cart.html" class="btn btn-outline-light">
        Cart <span id="cart-badge" class="badge bg-warning text-dark">0</span>
      </a>
    </div>
  </nav>

  <!-- Cart Container -->
  <div class="container py-5">
    <h2 class="mb-4">Your Cart</h2>
    <div id="cart-items"></div>
    <h4 id="cart-total" class="mt-3">Total: ₦0</h4>

    <button class="btn btn-success mt-3" onclick="openCheckout()">Checkout</button>
  </div>

  <!-- Checkout Confirmation Modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 shadow">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to place this order?</p>
          <p class="fw-bold" id="modal-total"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="placeOrder()">Yes, Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let cartItemsDiv = document.getElementById("cart-items");
    let total = 0;

    function renderCart() {
      cartItemsDiv.innerHTML = "";
      total = 0;

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("cart-total").innerText = "Total: ₦0";
        return;
      }

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        cartItemsDiv.innerHTML += `
          <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <div>
              <h5>${item.name}</h5>
              <p class="mb-0">₦${item.price} × ${item.qty} = ₦${itemTotal.toLocaleString()}</p>
            </div>
            <div>
              <button class="btn btn-outline-dark btn-sm" onclick="changeQty(${index}, -1)">–</button>
              <span class="mx-2">${item.qty}</span>
              <button class="btn btn-outline-dark btn-sm" onclick="changeQty(${index}, 1)">+</button>
              <button class="btn btn-sm btn-danger ms-2" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>`;
      });

      document.getElementById("cart-total").innerText = "Total: ₦" + total.toLocaleString();
      localStorage.setItem("cartCount", cart.reduce((sum, i) => sum + i.qty, 0));
      document.getElementById("cart-badge").innerText = localStorage.getItem("cartCount") || 0;
    }

    function changeQty(index, delta) {
      cart[index].qty = Math.max(1, cart[index].qty + delta);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function openCheckout() {
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }
      document.getElementById("modal-total").innerText = "Order Total: ₦" + total.toLocaleString();
      new bootstrap.Modal(document.getElementById("checkoutModal")).show();
    }

    function placeOrder() {
      // Save last order
      localStorage.setItem("lastOrder", JSON.stringify(cart));
      // Clear cart
      localStorage.removeItem("cart");
      localStorage.setItem("cartCount", 0);
      // Redirect to tracking
      window.location.href = "tracking.html";
    }

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
